# Incus initialization preseed for opsavor-node-1.
# Non-interactive: sudo incus admin init --preseed < incus/preseed.yml
#
# Uses dir storage on the root filesystem. On DO droplets, ZFS DKMS fails
# to build against DO's custom kernel. dir is simple and works everywhere.
# On bare metal with stock kernels, switch to ZFS or btrfs for CoW snapshots.

config:
  core.https_address: "[::]:8443"
  # Trust password is set interactively after init, not baked in.

networks:
  - name: incusbr0
    type: bridge
    config:
      ipv4.address: 10.0.100.1/24
      ipv4.nat: "true"
      ipv6.address: none
      dns.mode: managed

storage_pools:
  - name: default
    driver: dir
    config: {}

profiles:
  - name: default
    config:
      limits.cpu: "1"
      limits.memory: 512MB
    devices:
      eth0:
        name: eth0
        network: incusbr0
        type: nic
      root:
        path: /
        pool: default
        type: disk

cluster: null
