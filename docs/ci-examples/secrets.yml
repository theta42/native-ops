name: Sync service secrets
# Copies services' secrets from this repository's secret store into the daemon's, where a service's
# env_from reads them. Run it after adding or changing one; the next deploy tag writes the new value into
# the service's environment file (its plan says "change KEY (from secret NAME)", never the value).
#
# The repository's deployer token may set service secrets (SERVICE_*) and nothing else in the store; the
# daemon's own credentials are an admin's to sync (docs/daemon.md).
on:
  workflow_dispatch:

env:
  NATIVE_OPS_URL: https://native-ops.example.com
  NATIVE_OPS_VERSION: vX.Y.Z
  NATIVE_OPS_SHA256: "<sha256 of the linux_amd64 tarball>"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"   # outside the checkout: the tree a plan or build uploads must not carry the tool
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}
          # git store name -> daemon store name (what env_from names)
          SERVICE_APP_API_KEY: ${{ secrets.APP_API_KEY }}
        # A secret that is empty here is not sent. --prune would also remove every service secret on the
        # daemon not named here; leave it off unless this list is complete.
        run: native-ops remote secret-sync SERVICE_APP_API_KEY
