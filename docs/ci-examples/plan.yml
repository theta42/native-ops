name: Plan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NATIVE_OPS_URL: https://native-ops.example.com
  NATIVE_OPS_VERSION: vX.Y.Z
  NATIVE_OPS_SHA256: "<sha256 of the linux_amd64 tarball>"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: native-ops validate --config-dir .
      - name: Plan against the host (changes nothing)
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_PLAN_TOKEN }}   # a planner token
        run: |
          set -euo pipefail
          # exits 1 only when the plan is blocked (apply would fail); the last line is "plan <hash>"
          native-ops remote plan --config-dir . | tee plan.txt
      # Post plan.txt as a pull-request comment with your Git host's API (see the README of your
      # forge's actions); the hash on its last line is what an admin approves.
