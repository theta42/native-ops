name: Maintenance
# The pipeline's schedule is the schedule: the daemon runs each step as a job with a record.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  NATIVE_OPS_URL: https://native-ops.example.com
  NATIVE_OPS_VERSION: vX.Y.Z
  NATIVE_OPS_SHA256: "<sha256 of the linux_amd64 tarball>"

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native-ops (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"   # outside the checkout: the tree a plan or build uploads must not carry the tool
          curl -fsSL --proto '=https' --tlsv1.2 -o native-ops.tgz \
            "https://github.com/theta42/native-ops/releases/download/${NATIVE_OPS_VERSION}/native-ops_${NATIVE_OPS_VERSION}_linux_amd64.tar.gz"
          echo "${NATIVE_OPS_SHA256}  native-ops.tgz" | sha256sum -c -
          tar -xzf native-ops.tgz
          install -D -m 0755 "native-ops_${NATIVE_OPS_VERSION}_linux_amd64" "$HOME/.local/bin/native-ops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Needs the daemon started with --enable-backup, and the backup keys and pins synced to it by an
      # admin (native-ops remote secret-sync; see docs/daemon.md). DNS records need no schedule: they are
      # part of the plan and change with a deploy tag.
      - name: Back up volumes and apply retention
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}
        run: native-ops remote backup --config-dir . --prune
      # Needs --enable-image-build. Deletes images no instance runs: orphans left by rebuilds and old tags
      # beyond --image-keep per app (builds already clean up after themselves; this catches the rest).
      - name: Prune images
        env:
          NATIVE_OPS_TOKEN: ${{ secrets.NATIVE_OPS_TOKEN }}
        run: native-ops remote image-prune
