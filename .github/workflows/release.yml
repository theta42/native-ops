name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${TARGETS[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            BIN_NAME="native-ops_${TAG}_${GOOS}_${GOARCH}"
            echo "Building ${BIN_NAME}..."
            # CGO off: one static binary that runs on any Linux (older glibc, Alpine, a minimal container),
            # which is the point of a tool you drop onto a host.
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.Version=${TAG}" -o "dist/${BIN_NAME}" ./cmd/native-ops
            if [ "$GOOS" = "linux" ] && ! file "dist/${BIN_NAME}" | grep -q "statically linked"; then
              echo "::error::${BIN_NAME} is not statically linked"; file "dist/${BIN_NAME}"; exit 1
            fi
            tar -czf "dist/${BIN_NAME}.tar.gz" -C dist "${BIN_NAME}"
            rm "dist/${BIN_NAME}"
          done

          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
