name: Test & Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "::error::run go mod tidy"; exit 1; }

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Check the UI script parses
        run: node --check pkg/server/ui/static/js/app.js

      - name: Verify Build
        run: CGO_ENABLED=0 go build -v -o /dev/null ./cmd/native-ops
